<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>E-Mail als Task</title>
    <style>
      :root {
        --accent: #2b8a3e;
      }
      body {
        font-family: system-ui, sans-serif;
        width: 360px;
        margin: 0;
        padding: 12px;
        color: #1f2329;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 8px;
      }
      label {
        display: block;
        font-size: 11px;
        color: #6b7280;
        margin: 8px 0 2px;
      }
      input,
      textarea {
        width: 100%;
        box-sizing: border-box;
        font-family: inherit;
        font-size: 13px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        padding: 6px 8px;
      }
      textarea {
        resize: vertical;
        min-height: 120px;
      }
      .check {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        color: #1f2329;
        margin-top: 10px;
      }
      select {
        width: 100%;
        box-sizing: border-box;
        font-family: inherit;
        font-size: 13px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        padding: 6px 8px;
        background: #fff;
      }
      .batch-list {
        margin: 0;
        padding: 6px 8px 6px 24px;
        max-height: 220px;
        overflow-y: auto;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        font-size: 12px;
      }
      .batch-list li {
        margin: 2px 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .check input {
        width: auto;
        margin: 0;
      }
      button {
        margin-top: 12px;
        width: 100%;
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: 6px;
        padding: 9px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .hint {
        font-size: 11px;
        color: #6b7280;
        margin-top: 8px;
      }
      .hint a {
        color: var(--accent);
      }
      .status {
        font-size: 12px;
        margin-top: 8px;
        min-height: 16px;
      }
      .status.ok {
        color: var(--accent);
      }
      .status.err {
        color: #b91c1c;
      }
    </style>
  </head>
  <body>
    <h1 id="heading">E-Mail als Aufgabe</h1>

    <div id="single">
      <label for="title">Titel</label>
      <input id="title" type="text" placeholder="Betreff…" />

      <label for="note">Notiz</label>
      <textarea id="note" placeholder="Absender, Link, Text…"></textarea>
    </div>

    <div id="batch" hidden>
      <ul id="batchList" class="batch-list"></ul>
    </div>

    <label for="project">Projekt</label>
    <select id="project">
      <option value="">📥 Inbox</option>
    </select>

    <label class="check"><input id="today" type="checkbox" /> Für Heute einplanen ☀️</label>

    <button id="add" disabled>Zu SelfManaged hinzufügen</button>

    <div class="status" id="status"></div>
    <p class="hint">
      Tipp: In der Liste mehrere Mails anhaken → je Mail eine Aufgabe. Text in der Mail
      markieren → nur der landet in der Notiz. <a href="#" id="opts">Optionen</a>
    </p>

    <script src="shared.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
